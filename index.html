<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advance Happie Birthday Kadhali ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating hearts, flowers and messages -->
    <div id="floating-elements"></div>

    <div class="container">

        <!-- Heading -->
        <h1>
            Advance Happie Birthday<br>
            Kadhali <span>❤️</span>
        </h1>

        <!-- Countdown -->
        <div class="countdown">
            <div id="days">10</div>
            <p>DAYS TO GO</p>
        </div>


        <!-- Main Romantic Card -->
        <div class="main-card">

            <div class="card" onclick="openCard(this)">

                <div class="card-inner">

                    <div class="card-front">
                        <div class="card-icon">💌</div>
                        <h2>OPEN ME</h2>
                        <p>A little message<br>for you... ❤️</p>
                    </div>

                    <div class="card-back">
                        <p id="message1">
                            Your first surprise message ❤️
                        </p>
                    </div>

                </div>

            </div>

        </div>


        <!-- Dirty Corner Card -->
        <div class="dirty-card-area">

            <div class="dirty-card" onclick="openCard(this)">

                <div class="dirty-card-inner">

                    <div class="dirty-card-front">
                        <div class="dirty-icon">🖤</div>

                        <h2>
                            DIRTY CORNER 🫦🌶️
                        </h2>

                        <p>
                            Enter if you dare... 😏
                        </p>
                    </div>

                    <div class="dirty-card-back">
                        <p id="message2">
                            Your naughty joke goes here 😏🌶️
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
